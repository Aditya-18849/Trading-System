services:
  # 1. PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: algo-trading-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: trading_system
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    networks:
      - algo-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. Redis (for rate limiting, caching, celery if needed)
  redis:
    image: redis:7-alpine
    container_name: algo-trading-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - algo-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 3. FastAPI Trading Backend
  app:
    build: .
    container_name: algo-trading-app
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - algo-network
    volumes:
      - ./app:/app/app:ro
      - ./scripts:/app/scripts:ro
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  # 4. Frontend Dashboard (Next.js)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # UPDATED: Pointing to localhost so the browser can reach the FastAPI backend
        NEXT_PUBLIC_API_URL: http://localhost:8000
        NEXT_PUBLIC_WS_URL: ws://localhost:8000
    container_name: algo-trading-frontend
    restart: unless-stopped
    env_file:
      - ./frontend/.env
    ports:
      - "3000:3000"
    depends_on:
      - app
    networks:
      - algo-network
    # The volumes block was removed here to prevent overwriting the standalone build files

networks:
  algo-network:
    driver: bridge

volumes:
  postgres_data: