# A generic, single database configuration.

[alembic]
# Path to migration environment
script_location = alembic

# Template used to generate migration files. Uncomment to use a custom template.
# file_template = %%(rev)s_%%(slug)s

# sys.path prepend: ensures the app package is importable
prepend_sys_path = .

# Timezone for revision timestamps (SEBI compliance — IST)
timezone = Asia/Kolkata

# Database URL — overridden at runtime by env.py from app.config.settings
sqlalchemy.url = driver://user:pass@localhost/dbname

[post_write_hooks]
# Uncomment to run ruff or black on newly generated migration files
# hooks = ruff
# ruff.type = exec
# ruff.executable = ruff
# ruff.options = format REVISION_SCRIPT_FILENAME

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
